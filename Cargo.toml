[workspace]
resolver = "3"
members = ["crates/ignition-cli", "crates/ignition-core", "crates/ignition-tui"]

[workspace.package]
edition = "2024"
rust-version = "1.88" # CORRECTED: keyring 4.1.x floor (was 1.85 in STACK.md)
version = "1.0.0"

[workspace.dependencies]
ignition-core = { path = "crates/ignition-core" }
ignition-tui = { path = "crates/ignition-tui" }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "fs", "io-std", "io-util", "process", "sync"] } # fs: streaming export writes (03-02); io-std/io-util: stdin import read; process: docker compose shell-out (04-01); sync: the e2e live-gate serializer mutex (05-06 — the live tests mutate SHARED gateway state)
reqwest = { version = "0.13", default-features = true, features = ["json", "query", "stream"] } # query: .query() for ListQuery params (02-01); stream: bytes_stream for the export download (03-02)
futures-util = { version = "0.3", default-features = false, features = ["std"] } # StreamExt over the export chunk stream (arrives transitively with reqwest's stream feature; declared direct so the import is legal)
async-trait = "0.1" # GatewayApi: dyn-compatible today, ubiquitous (research Open Question 2, resolved)
toml = "1.1"
directories = "6.0"
keyring = "4.1"
thiserror = "2.0"
semver = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] } # serde feature: Profile.url round-trips through TOML/JSON
percent-encoding = "2" # already a transitive dep of url; declared so encode_segment's direct import is legal (03-01)
zip = { version = "8.6", default-features = false, features = ["deflate"] } # 05-02: project-export zip member surgery (resource family re-point) — the ONLY new dependency, research-approved; deflate covers Ignition export zips both ways
# Phase 6 (TUI): ratatui floor-pinned at 0.30.2 — 0.30.1 bumped MSRV 1.86→1.88
# in a PATCH release, so patch drift can move MSRV; the floor rides the
# 1.88-MSRV release and CI (stable) catches future bumps. crossterm takes the
# event-stream feature for the async EventStream select loop — and the direct
# 0.29 dep keeps the graph single-major (ratatui-crossterm defaults to 0.29).
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
# dev
wiremock = "0.6"
snapbox = { version = "1.2", features = ["cmd", "json", "regex"] } # dev-dep only
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
