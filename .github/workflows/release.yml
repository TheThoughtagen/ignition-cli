name: Release

# The one-push release pipeline. Pushing a tag (v1.6.0, v1.7.0-rc.1, ...)
# triggers:
#
#   version          — the tag is the version: v1.6.0 releases 1.6.0. Refuses
#                      a tag that is not vX.Y.Z[-pre] or whose commit is not on
#                      main. build and publish-crates stamp this version into
#                      Cargo.toml before they compile, so no bump commit is
#                      needed on main.
#   build            — 5-target release matrix; tarballs + sha256 attached
#                      to the GitHub release (created if missing). Windows
#                      ships a .zip (locked no-Windows decision REVERSED
#                      2026-09-17 — see the matrix below).
#                      aarch64-apple-darwin       (native on macos-latest)
#                      x86_64-apple-darwin        (cross on the same mac)
#                      x86_64-unknown-linux-gnu   (native on ubuntu-latest)
#                      aarch64-unknown-linux-gnu  (native on ubuntu-24.04-arm)
#                      x86_64-pc-windows-msvc     (native on windows-latest, zip)
#   attest           — runs after build, for tag refs (refs/tags/v*) only; downloads
#                      the archives THIS run's build job packaged (never the
#                      release's assets, so a re-run cannot sign what someone
#                      else put on the release) and publishes a GitHub
#                      build-provenance attestation for each (verify with
#                      gh attestation verify <asset> --repo TheThoughtagen/ignition-cli
#                      --source-ref refs/tags/<tag>). id-token and attestations
#                      write live on this job only, which runs no third-party
#                      action.
#   publish-crates   — cargo publish --workspace (core → tui → cli) after the
#                      binaries prove the tag builds; idempotent: skips when
#                      the version is already on crates.io
#
# Prereqs (one-time): repo secret CARGO_REGISTRY_TOKEN — a crates.io token
# with publish-new AND publish-update scopes (new covers the first version of
# each crate; update is required for every later version). See RELEASING.md.
#
# Re-run manually: workflow_dispatch (tag input names the release; publish
# toggle controls the crates.io step).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v1.0)"
        required: true
        default: "v1.0"
      publish:
        description: "Publish crates to crates.io"
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Derive the version from the tag and check the tag is on main
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag $TAG_NAME is not vX.Y.Z or vX.Y.Z-pre; nothing is released"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG_NAME ($GITHUB_SHA) is not on main; tag a commit on main"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION from $GITHUB_SHA"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            rustflags: '-D warnings'
          - os: macos-latest
            target: x86_64-apple-darwin
            rustflags: '-D warnings'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: '-D warnings'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: '-D warnings'
          # Windows joins the release matrix — locked no-Windows decision
          # REVERSED (2026-09-17) alongside the ring TLS flip. The exe is
          # zipped (not tarred) and the sha256 rides Get-FileHash.
          #
          # `+crt-static` links the MSVC C runtime (vcruntime, the UCRT and the
          # C++ runtime) into ign.exe, so the zip runs on a Windows Server
          # without the VC++ redistributable. The release build must not import
          # any vcruntime or msvcp DLL: the UAT on ign-win-836 failed with
          # STATUS_DLL_NOT_FOUND (0xC0000135). The import check step below
          # enforces it before anything is packaged.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: '-D warnings -C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # `target`, NOT `targets` — the action rejects the plural and warned
          # "Unexpected input(s) 'targets'" on every release build, silently
          # installing no cross target at all. The explicit rustup step below
          # is what actually made cross builds work; it stays as belt and
          # braces now that the input is spelled correctly.
          target: ${{ matrix.target }}
          # Per-target RUSTFLAGS go through this input, not a .cargo/config.toml:
          # the action exports RUSTFLAGS (default `-D warnings`) through
          # GITHUB_ENV whenever RUSTFLAGS is unset, and cargo lets RUSTFLAGS
          # override every `target.<triple>.rustflags` in a config file, so a
          # config-file flag would be dropped without an error. Because the
          # build passes `--target`, RUSTFLAGS applies to the target artifacts
          # only; build scripts and proc macros are still built for the host.
          rustflags: ${{ matrix.rustflags }}
      - name: Ensure target std is installed
        run: rustup target add --toolchain stable ${{ matrix.target }}
      - name: Stamp the version from the tag into Cargo.toml
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # [workspace.package] version and the two path-dependency versions.
          sed -i.orig -E \
            -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/' \
            -e 's/^(ignition-(core|tui) = \{ path = "[^"]*", version = )"[^"]*"/\1"'"$VERSION"'"/' \
            Cargo.toml
          rm Cargo.toml.orig
          for want in "^version = \"$VERSION\"$" \
                      "^ignition-core = .*version = \"$VERSION\" }$" \
                      "^ignition-tui = .*version = \"$VERSION\" }$"; do
            grep -qE "$want" Cargo.toml || { echo "::error::Cargo.toml did not take version $VERSION ($want)"; cat Cargo.toml; exit 1; }
          done
          cargo update -w
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release -p ignition-cli --target ${{ matrix.target }}
      - name: Check the Windows binary links the C runtime statically
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IGN_EXE: target/${{ matrix.target }}/release/ign.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found through vswhere' }
          $out = & $dumpbin /nologo /dependents $env:IGN_EXE
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed with exit code $LASTEXITCODE" }
          $dlls = @($out | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^[A-Za-z0-9_.-]+\.dll$' })
          if (-not ($dlls | Where-Object { $_ -ieq 'KERNEL32.dll' })) {
            throw 'the dependents list of ign.exe has no KERNEL32.dll, so it was not read'
          }
          $crt = @($dlls | Where-Object { $_ -match '^(vcruntime|msvcp)' })
          if ($crt.Count -gt 0) {
            throw "ign.exe imports the VC++ runtime ($($crt -join ', ')); the release build must link it statically (+crt-static)"
          }
          Write-Host ('ign.exe imports: ' + ($dlls -join ', '))
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### ign.exe imports'
          foreach ($d in $dlls) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $d" }
      - name: Package tarball
        if: runner.os != 'Windows'
        run: |
          ART="ign-${{ env.TAG_NAME }}-${{ matrix.target }}"
          mkdir "$ART"
          cp "target/${{ matrix.target }}/release/ign" "$ART/"
          cp README.md LICENSE "$ART/"
          tar -czf "$ART.tar.gz" "$ART"
          shasum -a 256 "$ART.tar.gz" > "$ART.tar.gz.sha256"
      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $art = "ign-${{ env.TAG_NAME }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ign.exe" "$art/"
          Copy-Item README.md, LICENSE "$art/"
          Compress-Archive -Path $art -DestinationPath "$art.zip"
          (Get-FileHash "$art.zip" -Algorithm SHA256).Hash.ToLower() + "  $art.zip" |
            Set-Content "$art.zip.sha256"
      - name: Keep the archive for the attest job
        # The attest job attests exactly these files, not what the release
        # serves later. Archives only; the .sha256 files are not attested.
        uses: actions/upload-artifact@v7
        with:
          name: ign-archive-${{ matrix.target }}
          path: |
            ign-*.tar.gz
            ign-*.zip
          if-no-files-found: error
      - name: Upload to release
        # v3 = the same action on the Node 24 runtime (no input changes).
        # v2 targets Node 20, which GitHub now force-runs on Node 24 and
        # warns about on every release build.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ign-*.tar.gz
            ign-*.tar.gz.sha256
            ign-*.zip
            ign-*.zip.sha256

  attest:
    # Build provenance for the archives this run built. A job of its own so
    # that id-token: write (an OIDC identity that signs as this workflow) is not
    # available to the build job's third-party actions. Tag refs only: the
    # attestation's source ref is then refs/tags/<tag>, which the deploy
    # actions' gh attestation verify --source-ref pins.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the build archives
        uses: actions/download-artifact@v8
        with:
          pattern: ign-archive-*
          merge-multiple: true
          path: assets
      - name: List the archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(assets/ign-*.tar.gz assets/ign-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::the build job left no ign archive to attest"
            exit 1
          fi
          printf '%s\n' "${archives[@]}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/ign-*

  publish-crates:
    needs: [version, build] # only publish crates once the tag's binaries prove it builds
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Stamp the version from the tag into Cargo.toml
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # [workspace.package] version and the two path-dependency versions.
          sed -i.orig -E \
            -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/' \
            -e 's/^(ignition-(core|tui) = \{ path = "[^"]*", version = )"[^"]*"/\1"'"$VERSION"'"/' \
            Cargo.toml
          rm Cargo.toml.orig
          for want in "^version = \"$VERSION\"$" \
                      "^ignition-core = .*version = \"$VERSION\" }$" \
                      "^ignition-tui = .*version = \"$VERSION\" }$"; do
            grep -qE "$want" Cargo.toml || { echo "::error::Cargo.toml did not take version $VERSION ($want)"; cat Cargo.toml; exit 1; }
          done
          cargo update -w
      - name: Fail fast on missing token
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set."
            echo "::error::Create a crates.io token (publish-new + publish-update scopes) at"
            echo "::error::https://crates.io/settings/tokens and add it as a repo secret:"
            echo "::error::gh secret set CARGO_REGISTRY_TOKEN"
            exit 1
          fi
      - name: Skip if this version is already published (idempotent re-runs)
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "//;s/"//')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: ignition-cli-release-pipeline" \
            "https://crates.io/api/v1/crates/ignition-cli/$VERSION")
          if [ "$CODE" = "200" ]; then
            echo "ignition-cli $VERSION is already on crates.io — skipping publish."
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
          else
            echo "ignition-cli $VERSION not yet published (HTTP $CODE) — publishing."
          fi
      - name: Publish workspace (core → tui → cli, cargo orders it)
        if: env.SKIP_PUBLISH != '1'
        # --allow-dirty: the version was stamped from the tag in this checkout.
        run: cargo publish --workspace --allow-dirty
      - name: Post-publish verification
        if: env.SKIP_PUBLISH != '1'
        run: |
          sleep 5 # registry index propagation
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "//;s/"//')
          for CRATE in ignition-core ignition-tui ignition-cli; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: ignition-cli-release-pipeline" \
              "https://crates.io/api/v1/crates/$CRATE/$VERSION")
            echo "$CRATE@$VERSION → HTTP $CODE"
            [ "$CODE" = "200" ] || exit 1
          done
          echo "All three crates live on crates.io at $VERSION."
