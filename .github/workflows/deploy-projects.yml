name: ign deploy projects (reusable)

# Reusable workflow for callers in the same organization or enterprise: deploy
# one Ignition project from its own repo to one environment. The `check` job
# runs `ign deploy projects --check` (GET requests only) and exposes the
# canonical artifact_sha256 of the checkout. The `apply` job needs `check`, runs
# under the caller's GitHub environment (the approval gate) and deploys exactly
# that hash. One project and one environment per call; the caller chains
# environments (dev, then prod) as separate jobs, each with its own check
# against its own gateway.
#
# The step logic lives in the composite actions deploy-projects-check and
# deploy-projects-apply (.github/actions). Each job checks out this repository
# at job.workflow_sha, the commit of this very workflow file, and runs the
# action from there, so the workflow and the actions it runs come from one
# commit and there is one source, not a copy.
#
# Environment secrets reach this workflow's apply job only when a caller in the
# same organization or enterprise passes `secrets: inherit`. A caller in
# another organization cannot use this workflow for the apply; it writes its own
# two jobs with the composite actions instead (see the README), and its apply
# job's own `environment:` resolves the environment secrets natively. The apply
# job here fails first, naming that cause, when its write secrets are empty.
#
# Secret split (approval gate): the check job runs before and without the
# environment approval, so it gets its own secrets, IGN_CHECK_TOKEN (read-only)
# and IGN_CHECK_SSH_KEY. Only the apply job, which runs under the approved
# environment, references the write-capable IGN_MASTER_TOKEN and IGN_SSH_KEY.
# Neither job falls back to the other's secrets.
#
# The reviewed targets/<env>.yaml and known_hosts files are read from a second
# repository (default WhiskeyHouse/whk-onprem-infra-iac) checked out read-only
# with the IGN_TARGETS_TOKEN secret; the token is never printed and the
# checkout keeps no credentials.
#
# Every checkout, and every step that runs git or ign, disables core.autocrlf
# for itself through the git environment config, so a runner whose system
# gitconfig sets core.autocrlf=true (Git for Windows) still gets checkouts that
# are byte-identical to the repositories.

on:
  workflow_call:
    inputs:
      env:
        description: Environment name; selects targets/<env>.yaml below targets-dir and the entry in deploy/project.yaml.
        type: string
        required: true
      environment:
        description: GitHub environment whose protection rules approve the apply job.
        type: string
        required: true
      ign-version:
        description: ign release tag to install, for example v1.6.0.
        type: string
        required: true
      release:
        description: Release tag being deployed, for example v1.4.0 (github.ref_name of a v* tag).
        type: string
        required: true
      master-profile:
        description: ign profile name of the master gateway.
        type: string
        required: true
      master-url:
        description: Gateway URL of the master profile.
        type: string
        required: true
      runs-on:
        description: JSON label list for runs-on, for example '["self-hosted", "windows", "my-deploy-runner"]'. Use a label that only the intended deploy runner carries, so no other runner can pick up a job that holds deploy secrets.
        type: string
        default: '["self-hosted"]'
      repo-dir:
        description: Project repo root, relative to the project checkout.
        type: string
        default: .
      targets-repository:
        description: Repository holding targets/<env>.yaml and the known_hosts files, as owner/name.
        type: string
        default: WhiskeyHouse/whk-onprem-infra-iac
      targets-ref:
        description: Branch, tag or commit of targets-repository to read. The check job resolves it to a commit and the apply job reads exactly that commit, so a moving branch cannot change the target between the check and the approval.
        type: string
        default: main
      targets-dir:
        description: Folder of targets-repository that holds targets/ (the --targets directory).
        type: string
        default: ignition
      designers-timeout:
        description: Seconds to wait for open Designer sessions to close before stopping, before any write.
        type: number
        default: 600
      ssl-verify:
        description: Verify gateway TLS certificates.
        type: boolean
        default: true
      ssh-key-env:
        description: Name of the environment variable that the target's nodes.*.ssh.key_env names, for example DEPLOY_SSH_KEY. It must not be PATH, HOME, BASH_ENV, ENV, IFS, SHELLOPTS, PS4 or CDPATH, and must not start with GITHUB_, RUNNER_, ACTIONS_, IGNITION_, IGN_, LD_ or DYLD_. Receives the IGN_CHECK_SSH_KEY secret in the check job and the IGN_SSH_KEY secret in the apply job.
        type: string
        default: ''
    secrets:
      IGN_CHECK_TOKEN:
        description: Read-only gateway API token for the check job only. Never the write token.
        required: true
      IGN_CHECK_SSH_KEY:
        description: Private key text for the check job's ssh target (the .git probe and the record read). Never the apply key.
        required: false
      IGN_MASTER_TOKEN:
        description: Write-capable API token for the apply job only. A secret of the GitHub environment named by the environment input; it reaches this workflow only through `secrets inherit` from a caller in the same organization or enterprise (a caller in another organization uses the composite actions).
        required: false
      IGN_SSH_KEY:
        description: Private key text for the apply job's ssh target. A secret of the GitHub environment named by the environment input; it reaches this workflow only through `secrets inherit` from a caller in the same organization or enterprise (a caller in another organization uses the composite actions).
        required: false
      IGN_TARGETS_TOKEN:
        description: Same-org token with read access to targets-repository only (contents read).
        required: true
    outputs:
      artifact_sha256:
        description: Canonical artifact_sha256 of the checkout, as checked and as applied.
        value: ${{ jobs.check.outputs.artifact_sha256 }}
      targets_sha:
        description: Commit of targets-repository the check read and the apply job read again.
        value: ${{ jobs.check.outputs.targets_sha }}
      outcome:
        description: Classified outcome of the apply (created, imported, recorded, skipped, imported_unverified, and so on).
        value: ${{ jobs.apply.outputs.outcome }}
      run_id:
        description: ign run id of the apply (empty when no run directory was written).
        value: ${{ jobs.apply.outputs.run_id }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.check.outputs.artifact_sha256 }}
      action: ${{ steps.check.outputs.action }}
      targets_sha: ${{ steps.check.outputs.targets_sha }}
    steps:
      - name: Locate the ign deploy actions
        shell: bash
        env:
          IGN_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          IGN_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # >>> body:actions-ref
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$IGN_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}/[A-Za-z0-9._-]{1,100}$ ]] \
            || fail "the reusable workflow cannot name its own repository (job.workflow_repository is empty or malformed); call the composite actions deploy-projects-check and deploy-projects-apply directly"
          [[ "$IGN_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "the reusable workflow cannot name its own commit (job.workflow_sha is empty or malformed); call the composite actions deploy-projects-check and deploy-projects-apply directly"
          echo "ign deploy actions: $IGN_WORKFLOW_REPOSITORY@$IGN_WORKFLOW_SHA"
          # <<< body:actions-ref

      - name: Checkout the ign deploy actions
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ign-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Verify the ign deploy actions commit
        shell: bash
        env:
          IGN_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        run: |
          # >>> body:verify-actions-sha
          set -euo pipefail
          want="$IGN_WORKFLOW_SHA"
          have="$(git -C .ign-actions rev-parse HEAD)"
          if [ "$have" != "$want" ]; then
            echo "::error::the ign deploy actions checkout is at $have, not the workflow's own commit $want"
            exit 1
          fi
          # <<< body:verify-actions-sha

      - name: ign deploy projects --check
        id: check
        uses: ./.ign-actions/.github/actions/deploy-projects-check
        with:
          env: ${{ inputs.env }}
          ign-version: ${{ inputs.ign-version }}
          release: ${{ inputs.release }}
          master-profile: ${{ inputs.master-profile }}
          master-url: ${{ inputs.master-url }}
          repo-dir: ${{ inputs.repo-dir }}
          targets-repository: ${{ inputs.targets-repository }}
          targets-ref: ${{ inputs.targets-ref }}
          targets-dir: ${{ inputs.targets-dir }}
          ssl-verify: ${{ inputs.ssl-verify }}
          ssh-key-env: ${{ inputs.ssh-key-env }}
          check-token: ${{ secrets.IGN_CHECK_TOKEN }}
          check-ssh-key: ${{ secrets.IGN_CHECK_SSH_KEY }}
          targets-token: ${{ secrets.IGN_TARGETS_TOKEN }}

  apply:
    needs: check
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: ign-deploy-projects-${{ inputs.env }}-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.apply.outputs.run_id }}
      outcome: ${{ steps.apply.outputs.outcome }}
    steps:
      - name: Check the apply secrets
        shell: bash
        env:
          IGN_MASTER_TOKEN: ${{ secrets.IGN_MASTER_TOKEN }}
          IGN_SSH_KEY: ${{ secrets.IGN_SSH_KEY }}
          IGN_SSH_KEY_ENV: ${{ inputs.ssh-key-env }}
        run: |
          # >>> body:apply-secrets
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          cause="environment secrets reach a reusable workflow only through secrets: inherit from a caller in the same organization or enterprise; a caller in another organization uses the composite actions deploy-projects-check and deploy-projects-apply instead"
          [ -n "$IGN_MASTER_TOKEN" ] \
            || fail "the IGN_MASTER_TOKEN secret is empty in the apply job: $cause"
          if [ -n "$IGN_SSH_KEY_ENV" ] && [ -z "$IGN_SSH_KEY" ]; then
            fail "ssh-key-env is set but the IGN_SSH_KEY secret is empty in the apply job: $cause"
          fi
          # <<< body:apply-secrets

      - name: Locate the ign deploy actions
        shell: bash
        env:
          IGN_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          IGN_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # >>> body:actions-ref
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$IGN_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}/[A-Za-z0-9._-]{1,100}$ ]] \
            || fail "the reusable workflow cannot name its own repository (job.workflow_repository is empty or malformed); call the composite actions deploy-projects-check and deploy-projects-apply directly"
          [[ "$IGN_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "the reusable workflow cannot name its own commit (job.workflow_sha is empty or malformed); call the composite actions deploy-projects-check and deploy-projects-apply directly"
          echo "ign deploy actions: $IGN_WORKFLOW_REPOSITORY@$IGN_WORKFLOW_SHA"
          # <<< body:actions-ref

      - name: Checkout the ign deploy actions
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ign-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Verify the ign deploy actions commit
        shell: bash
        env:
          IGN_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        run: |
          # >>> body:verify-actions-sha
          set -euo pipefail
          want="$IGN_WORKFLOW_SHA"
          have="$(git -C .ign-actions rev-parse HEAD)"
          if [ "$have" != "$want" ]; then
            echo "::error::the ign deploy actions checkout is at $have, not the workflow's own commit $want"
            exit 1
          fi
          # <<< body:verify-actions-sha

      - name: ign deploy projects
        id: apply
        uses: ./.ign-actions/.github/actions/deploy-projects-apply
        with:
          env: ${{ inputs.env }}
          ign-version: ${{ inputs.ign-version }}
          release: ${{ inputs.release }}
          master-profile: ${{ inputs.master-profile }}
          master-url: ${{ inputs.master-url }}
          artifact-sha256: ${{ needs.check.outputs.artifact_sha256 }}
          targets-sha: ${{ needs.check.outputs.targets_sha }}
          repo-dir: ${{ inputs.repo-dir }}
          targets-repository: ${{ inputs.targets-repository }}
          targets-dir: ${{ inputs.targets-dir }}
          designers-timeout: ${{ inputs.designers-timeout }}
          ssl-verify: ${{ inputs.ssl-verify }}
          ssh-key-env: ${{ inputs.ssh-key-env }}
          master-token: ${{ secrets.IGN_MASTER_TOKEN }}
          ssh-key: ${{ secrets.IGN_SSH_KEY }}
          targets-token: ${{ secrets.IGN_TARGETS_TOKEN }}
