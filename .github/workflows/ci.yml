name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  check:
    strategy:
      matrix:
        # No Windows — LOCKED planner decision (macOS/Linux primary targets).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      # Prove the lean/agent build (no TUI feature) compiles.
      - run: cargo build -p ignition-cli --no-default-features

  # STATE.md keyring blocker closure: real-keyring round-trip on headless
  # Linux via the gnome-keyring recipe, verbatim from keyring-rs's own CI
  # (fetched 2026-08-21).
  keyring-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: gnome-keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
      - run: cargo test -p ignition-core --test keyring_smoke -- --ignored
