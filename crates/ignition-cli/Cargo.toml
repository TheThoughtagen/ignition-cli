[package]
name = "ignition-cli"
description = "ign — operate Ignition 8.3+ gateways from the terminal"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "ign"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ignition-tui"]

[dependencies]
ignition-core = { workspace = true }
ignition-tui = { workspace = true, optional = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
snapbox = { workspace = true }
wiremock = { workspace = true } # binary-level gateway contract tests (version exit classes)
reqwest = { workspace = true } # e2e openapi-capture gate fetches /openapi.json directly (03-03)
zip = { workspace = true } # dev-only (05-02): binary-level goldens build export-zip fixtures — same crate ignition-core already depends on, NOT a new dependency
