[package]
name = "ignition-tui"
description = "Ratatui TUI cockpit for ign — the interactive command surface over ignition-core actions"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# Phase 6 fills this crate: ratatui 0.30 + crossterm 0.29 (event-stream)
# are the only NEW runtime deps the whole phase takes — everything else
# was already in the workspace graph. tokio needs no feature additions
# (rt-multi-thread/macros/time/sync are workspace-enabled).
[dependencies]
ignition-core = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
# spawn_action's one-shot result serialization (pretty JSON to the
# result modal — the LOCKED one-mechanism display); both already in the
# workspace graph
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# isolated config files for the context unit tests (already in the
# workspace graph — NOT a new dependency)
tempfile = { workspace = true }
# wiremock gateway for the refresh-worker/dashboard fixture tests (the
# ignition-core test precedent; already in the workspace graph)
wiremock = { workspace = true }
# fixture payloads for client-model test constructors (workspace graph)
serde_json = { workspace = true }
